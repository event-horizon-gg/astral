[package]
name = "astral-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
headless-ui-tests = ["gpui/test-support"]

[dependencies]
async_zip = { version = "0.0.17", features = ["deflate"] }
base64 = "0.22"
flate2 = "1"
futures-lite = "2"
getrandom = "0.4"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "windows-manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
semver = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
regex = "1"
image = { version = "=0.25.10", default-features = false, features = ["dds", "jpeg", "png", "tga"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
icu_datetime = "=2.3.0"
icu_locale_core = "2"
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.26"

[profile.dev]
debug = 0

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
rfd = { version = "=0.17.2", default-features = false }
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary"] }
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSView", "NSWindow", "NSResponder", "NSAccessibility", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSPopUpButtonCell", "NSMenuItemCell", "NSButtonCell", "NSActionCell", "NSCell", "NSMenu", "NSFont", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Security_Credentials", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
